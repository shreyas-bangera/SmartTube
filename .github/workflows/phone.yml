name: Build Phone APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.PHONE_SIGNING_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Version name
        id: get_version
        run: |
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-phone-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      # Same key every build, so new APKs install as updates over old ones.
      - name: Configure signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "${{ secrets.PHONE_SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/phone.p12
          echo "storePassword=${{ secrets.PHONE_KEY_PASSWORD }}" > keystore.properties
          echo "keyAlias=smarttubephone" >> keystore.properties
          echo "keyPassword=${{ secrets.PHONE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/phone.p12" >> keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStphoneRelease

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stphone/release/*_arm64-v8a.apk
          if-no-files-found: error
